name: Build Windows

on:
  push:
    branches: [main, original-app-updates]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Runs the whole suite on Windows, including the in-app updater's real
      # PowerShell helper. Failures show up as annotations on this job.
      - name: Tests (Windows)
        continue-on-error: true
        run: flutter test --reporter github

      - run: flutter build windows --release

      # The in-app updater compares this number with the one in the update folder.
      - name: Stamp build number
        shell: pwsh
        run: Set-Content -Path build\windows\x64\runner\Release\version.txt -Value "${{ github.run_number }}" -Encoding ascii -NoNewline

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath budget_management_windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: budget_management_windows
          path: budget_management_windows.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: budget_management_windows.zip
