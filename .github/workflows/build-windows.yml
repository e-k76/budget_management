name: Build Windows

on:
  push:
    branches: [main, original-app-updates]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Runs the whole suite on Windows, including the in-app updater's real
      # PowerShell helper. Failures show up as annotations on this job.
      - name: Tests (Windows)
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          flutter test --reporter expanded 2>&1 | Tee-Object -FilePath test_output.txt
          exit $LASTEXITCODE

      # Surface each failing test (and its output) as an annotation on this job.
      - name: Report test failures
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path test_output.txt)) { exit 0 }
          $lines = Get-Content test_output.txt
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '\[E\]') {
              $end = [Math]::Min($i + 25, $lines.Count - 1)
              $msg = ($lines[$i..$end] -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
              Write-Host "::error title=Windows test failed::$msg"
            }
          }

      - run: flutter build windows --release

      # The in-app updater compares this number with the one in the update folder.
      - name: Stamp build number
        shell: pwsh
        run: Set-Content -Path build\windows\x64\runner\Release\version.txt -Value "${{ github.run_number }}" -Encoding ascii -NoNewline

      - name: Zip portable bundle
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath budget_management_windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: budget_management_windows
          path: budget_management_windows.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: budget_management_windows.zip
